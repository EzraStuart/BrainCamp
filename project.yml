name: BrainCamp
options:
  bundleIdPrefix: com.ezra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BrainCamp:
    type: application
    platform: iOS
    sources:
      - path: Sources/BrainCamp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ezra.BrainCamp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sources/BrainCamp/Resources/Info.plist
      properties:
        CFBundleDisplayName: BrainCamp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "BrainCamp uses your location to remind you about items when you arrive at or leave a place you've designated for them, like home or the office."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BrainCamp needs Always location access so it can remind you about important items even when the app isn't open — for example, catching your keys before you leave home."

  BrainCampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BrainCampTests
    dependencies:
      - target: BrainCamp
    settings:
      base:
        SWIFT_VERSION: "5.0"

schemes:
  BrainCamp:
    build:
      targets:
        BrainCamp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrainCampTests
    archive:
      config: Release
